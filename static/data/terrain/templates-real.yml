      - { x: 5.3, y: 6.29 }
      - { x: 5.78, y: 6.87 }
      - { x: 5.88, y: 7.38 }
      - { x: 6.11, y: 7.49 }
      - { x: 6.42, y: 8.05 }
      - { x: 7.1, y: 8.56 }
      - { x: 7.3, y: 8.96 }
      - { x: 7.55, y: 9.12 }
      - { x: 7.51, y: 9.34 }
