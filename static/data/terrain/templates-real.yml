# Detailed building templates for the v2 building-coordinate schema.
# These are the real GW terrain footprints, the higher-fidelity counterpart to
# the illustrative shapes in templates-simple.yml. Both files define the same
# template names, so a layout in combined.yml renders against either — the app
# picks one at runtime (the Templates control), and gen:presets uses
# templates-simple.yml for the bundled preset.
#
# A template is a rectangle (`width`/`height`), a polygon footprint
# (`points`: a closed ring of template-local { x, y } inches), or a curved path
# footprint (`start` plus `segments` of line/quad/cubic Béziers). A polygon's
# bounding box is normally derived from its points; here each polygon also
# declares an explicit `width`/`height`, so the solid body fills that box at
# the same size as its templates-simple.yml counterpart, and the small rubble
# nubbins poke *past* the box edge (the declared box is what placement and the
# converter line up against, not the nubbin extent).
#
# Footprints traced from the official GW terrain templates (40k_docs/templates.pdf):
# each piece's organic rubble edge is captured as a polygon, then scaled so the
# body matches templates-simple.yml's box (large-pipes 10x2.5, small-pipes 6x2,
# small-area 4x6, large-area 7x11.5, shoe 8x11.5). large-area / shoe / shoe-mirror
# follow the converter's transpose + trapezoid conventions (portrait, shoe
# narrow-at-top / wide-at-bottom, shoe-mirror its vertical flip — a piece and its
# 180° copy interlock into a clean rectangle).
#
# `small-area` and `large-area` were originally scaled so their *whole extent*,
# nubbins included, fit the box, which left the body inset from it by up to 0.44
# and 0.47in — and everything the 40kdc converter anchors to the box edge, the
# corner ruins above all, then hung over the drawn outline by up to 0.20in. They
# have since been re-fitted the documented way: the body span (measured by ray
# casting across the middle 76% of each side, so a rounded corner is charged to
# the two edges that meet there rather than to a whole edge) is mapped onto the
# box, which took small-area out by 1.071 on both axes and large-area by 1.073 in
# x — its y was already flush. The box outline now sits inside the drawn body
# everywhere. `shoe`/`shoe-mirror` still dip up to 0.61in inside their simple
# counterpart, but along the middle of the long slanted edge, where no rescale
# reaches it; that one wants a redrawn slant.
#
# `shoe-mirror` is derived, not traced: it is `shoe` vertex for vertex under
# y -> 11.5 - y, which is what makes a piece and its 180° copy interlock. Edit
# the two together and keep them exact — a re-fit that clamps each polygon on
# its own will drift them apart a hundredth of an inch at a time, which is how
# 4 of these 32 pairs came to disagree by up to 0.02in. `src/presets/
# presets.test.ts` pins the relation.

templates:
  # Feature pipes/barricades (ported 40kdc terrain). Distinct from the
  # large-/small-pipes *area* zones below. The GW dimensions are already the
  # real ones, so these match templates-simple.yml exactly.
  pipe:             { width: 5.5, height: 1 }
  barricade:
    points:
      - { x: 0,   y: 0 }
      - { x: 3.5, y: 0 }
      - { x: 3.5, y: 1 }
      - { x: 3,   y: 1 }
      - { x: 3,   y: 0.5 }
      - { x: 0.5, y: 0.5 }
      - { x: 0.5, y: 1 }
      - { x: 0,   y: 1 }

  # long line plate (10 x 2.5) — area-long-line
  # body fills the box; a bump on the top edge and one on the bottom poke past it.
  large-pipes:
    width: 10
    height: 2.5
    points:
      - { x: 0, y: 0.01 }
      - { x: 2.63, y: 0 }
      - { x: 3.08, y: -0.34 }
      - { x: 4.05, y: -0.55 }
      - { x: 4.25, y: -0.47 }
      - { x: 4.51, y: -0.09 }
      - { x: 4.74, y: 0 }
      - { x: 10, y: -0.01 }
      - { x: 10, y: 0.95 }
      - { x: 9.99, y: 2.5 }
      - { x: 9.53, y: 2.53 }
      - { x: 8.66, y: 2.95 }
      - { x: 8.17, y: 3.05 }
      - { x: 7.85, y: 3 }
      - { x: 7.44, y: 2.56 }
      - { x: 7.19, y: 2.49 }
      - { x: 2.78, y: 2.49 }
      - { x: 2.36, y: 2.64 }
      - { x: 1.47, y: 2.49 }
      - { x: 0, y: 2.49 }

  # short line plate (6 x 2) — area-short-line
  # body fills the box; a bump on the top edge and one on the bottom poke past it.
  small-pipes:
    width: 6
    height: 2
    points:
      - { x: 0, y: 0.01 }
      - { x: 3.45, y: 0 }
      - { x: 3.77, y: -0.36 }
      - { x: 4.24, y: -0.49 }
      - { x: 4.67, y: -0.4 }
      - { x: 5.09, y: -0.01 }
      - { x: 6, y: 0 }
      - { x: 6, y: 1.53 }
      - { x: 5.99, y: 2.01 }
      - { x: 2.23, y: 1.99 }
      - { x: 1.83, y: 2.25 }
      - { x: 1.69, y: 2.16 }
      - { x: 1.21, y: 2.23 }
      - { x: 1.05, y: 1.99 }
      - { x: 0, y: 2 }

  # medium area plate (4 x 6) — area-medium
  # body fills the box; bumps on the right and bottom edges poke past it.
  small-area:
    width: 4
    height: 6
    points:
      - { x: -0.01, y: 0 }
      - { x: 4, y: -0.05 }
      - { x: 4.02, y: 1.17 }
      - { x: 4.27, y: 1.5 }
      - { x: 4.38, y: 2 }
      - { x: 4.38, y: 2.03 }
      - { x: 4.18, y: 2.66 }
      - { x: 4.16, y: 3.32 }
      - { x: 4.03, y: 3.49 }
      - { x: 4, y: 6 }
      - { x: 3.17, y: 6.01 }
      - { x: 2.89, y: 6.36 }
      - { x: 2.53, y: 6.29 }
      - { x: 1.93, y: 6.54 }
      - { x: 1.79, y: 6.38 }
      - { x: 1.39, y: 6.36 }
      - { x: 1.05, y: 6.01 }
      - { x: 0, y: 6 }
      - { x: -0.01, y: 0.1 }

  # large area plate (7 x 11.5) — area-large
  # body fills the box; a spike on the right edge pokes past it.
  large-area:
    width: 7
    height: 11.5
    points:
      - { x: 7.04, y: 0 }
      - { x: 7.05, y: 1.32 }
      - { x: 7.39, y: 1.87 }
      - { x: 7.36, y: 2.24 }
      - { x: 7.63, y: 3.05 }
      - { x: 7.49, y: 3.33 }
      - { x: 7, y: 3.74 }
      - { x: 7, y: 4.35 }
      - { x: 7.25, y: 4.98 }
      - { x: 7.14, y: 5.91 }
      - { x: 7.5, y: 6.94 }
      - { x: 7.02, y: 8.43 }
      - { x: 7.04, y: 11.49 }
      - { x: 5.85, y: 11.51 }
      - { x: 0, y: 11.51 }
      - { x: -0.01, y: 0 }
      - { x: 0.88, y: 0 }

  # corner wedge trapezoid (8 x 11.5) — area-trapezoid
  # narrow-at-top / wide-at-bottom, matching templates-simple.yml's shoe.
  # body fills the box; a tab on the wide bottom edge pokes past it.
  shoe:
    width: 8
    height: 11.5
