      - { x: -0.01, y: 11.49 }
      - { x: -0.01, y: -0.02 }

  # vertical flip of shoe (wide-at-top / narrow-at-bottom)
  # body fills the box; a tab on the top edge pokes past it.
  shoe-mirror:
    width: 8
    height: 11.5
    points:
      - { x: 0.94, y: 11.52 }
      - { x: 2.02, y: 11.49 }
      - { x: 2.43, y: 10.7 }
      - { x: 2.53, y: 10.51 }
