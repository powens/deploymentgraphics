# All SVG visual properties live here — the single, opinionated theme.
# Geometry (deployment/*.yml, terrain/gw.yml) and behaviour (base.yml draw
# flags) carry no styling. snake_case keys are converted to kebab-case SVG
# attributes; a key already in kebab-case (e.g. vector-effect) passes through
# unchanged.

background:
  fill: "#f4f1e8"

half_way_lines:
  stroke: black
  stroke_dasharray: 0.5 0.5
  stroke_width: 0.2
  opacity: 0.5

territory:
  stroke: black
  stroke_width: 0.3
  opacity: 0.6

deployment:
  attacker:
    fill: "#cf4b33"
    stroke: none
    stroke_width: 0.4
  defender:
    fill: "#7d8b7f"
    stroke: none
    stroke_width: 0.4

building:
  group:
    opacity: 1
  template:
    # One outline weight for every building, matching `feature.stroke_width`
    # below so a ruin and the building it sits on are drawn with the same pen.
    # These used to be non-scaling strokes (1.2 for the grey templates, 1.5 for
    # pipe/barricade), i.e. a constant *viewport* width, which read thinner than
    # everything else on the card and disagreed between templates. Board units
    # (inches, like every other stroke_width here) instead: 0.2in.
    default:
      stroke: black
      stroke_width: &building-stroke 0.2
      fill: &stone-grey "#808080"
      opacity: 1
    # Ported 40kdc pipes (rust) and barricades (sand). The rust/sand fills are
    # anchored here and aliased by feature.palette below, which also holds their
    # darker accents. Both take a black outline (like the buildings) so they
    # read as defined pieces.
    pipe:             { fill: &rust-fill "#b9772e", stroke: black, stroke_width: *building-stroke }
    barricade:        { fill: &sand-fill "#c9a86a", stroke: black, stroke_width: *building-stroke }

grid:
  opacity: 0.3
  stroke: black
  stroke_width: 0.15
  stroke_dasharray: 0.1 0.1

objective:
  marker:
    # Warm near-black shared with the objective icons (icon.circle/glyph below).
    fill: &ink "#33312c"
    stroke: white
    stroke_width: 0.3
  label:
    font_size: 2
    fill: white

annotation:
  text:
    font_size: 1.5
    fill: black
  text_outline:
    stroke: white
    stroke_width: 0.3
    paint_order: stroke
  arrow:
    stroke: black
    stroke_width: 0.4

icon:
  circle:
    fill: &bone-fill "#e8dcc0"
    stroke: *ink
    stroke_width: 0.25
  glyph:
    fill: *ink

feature:
  stroke_width: 0.2
  # Neutral ramp: stone-light (#9aa0a6) → stone-grey (#808080, building fill) →
  # stone-dark (#5b6068) → #3f444a. gunmetal is the dark slate, kept for
  # hand-authored layouts; it shares the buildings' hue and only separates by
  # value, which is why gantries moved off it onto indigo — blue is the one gap
  # left in this palette (green ruins, rust pipes, sand barricades, teal
  # generators) and stays clear of the deployment zones' red and sage.
  palette:
    stone: { fill: "#9aa0a6", accent: &stone-dark "#5b6068" }
    rust: { fill: *rust-fill, accent: "#6e451a" }
    sand: { fill: *sand-fill, accent: "#7d6233" }
    green: { fill: "#4a8c3c", accent: "#2c5822" }
    gunmetal: { fill: *stone-dark, accent: "#3f444a" }
    teal: { fill: "#2f6b73", accent: "#1a3d42" }
    indigo: { fill: "#4a5aa8", accent: "#2c3566" }
    bone: { fill: *bone-fill, accent: "#9a8f76" }
