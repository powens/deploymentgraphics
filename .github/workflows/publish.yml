name: Publish to npm

# Publishes with provenance through npm trusted publishing (OIDC); no npm token
# is stored. The npm package must list this repo and workflow (publish.yml) as
# a trusted publisher, or the publish is rejected.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi

      # `prepublishOnly` runs the gates and `build:lib`. It is run by hand
      # because publishing a tarball skips lifecycle scripts.
      - name: Check and build
        run: pnpm run prepublishOnly

      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      # npm refuses to run inside this project: `devEngines.packageManager`
      # names pnpm (EBADDEVENGINES). Publish the tarball from outside it.
      - name: Publish
        working-directory: ${{ runner.temp }}
        run: npm publish ./deploymentgraphics-*.tgz --provenance --access public
